[package]
name = "isds"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Async high-level client for Czech ISDS data boxes"
license = "MIT"
repository = "https://github.com/interaso/isds"
documentation = "https://docs.rs/isds"
readme = "README.md"
keywords = ["isds", "databox", "czech", "soap"]
categories = ["api-bindings"]

[features]
default = []
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[dependencies]
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
jiff = "0.2"
mime = "0.3"
quick-xml = "0.42"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
roxmltree = "0.21"
secrecy = "0.10"
serde = { version = "1", optional = true }
sha2 = "0.11"
sha3 = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["attributes", "std"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
